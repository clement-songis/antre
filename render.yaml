services:
  - type: web
    name: antre
    runtime: image
    image:
      url: ghcr.io/antre-ai/antre:20261023.01
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ANTRE_NO_TLS
        value: "true"
      - key: ANTRE_CONFIG_DIR
        value: /tmp/antre/config
      - key: ANTRE_DATA_DIR
        value: /tmp/antre
      - key: ANTRE_BEHIND_PROXY
        value: "true"
      - key: ANTRE_DEPLOY_PLATFORM
        value: render
    dockerCommand: antre --bind 0.0.0.0 --port 10000 --no-tls
