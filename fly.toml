[build]
image = 'ghcr.io/antre-ai/antre:20261023.01'

[env]
ANTRE_BEHIND_PROXY    = 'true'
ANTRE_CONFIG_DIR      = '/data/config'
ANTRE_DATA_DIR        = '/data'
ANTRE_DEPLOY_PLATFORM = 'flyio'
ANTRE_NO_TLS          = 'true'

[processes]
app = '--bind 0.0.0.0 --port 8080 --no-tls'

[[mounts]]
destination = '/data'
source      = 'antre_data'

[http_service]
auto_start_machines  = true
auto_stop_machines   = 'stop'
force_https          = true
internal_port        = 8080
min_machines_running = 0
processes            = ['app']

[http_service.concurrency]
hard_limit = 250
soft_limit = 200
type       = 'connections'

[[http_service.checks]]
grace_period = '10s'
interval     = '30s'
method       = 'GET'
path         = '/health'
timeout      = '5s'
