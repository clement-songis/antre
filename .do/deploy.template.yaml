# NOTE: DigitalOcean App Platform does not support persistent disks for
# image-based services. Data (databases, sessions, memory) is ephemeral
# and will be lost on each redeploy. For persistent storage, use a
# Droplet with Docker instead.
spec:
  name: antre
  services:
    - name: antre
      image:
        registry_type: GHCR
        registry: ghcr.io
        repository: antre-ai/antre
        tag: "20261023.01"
      instance_count: 1
      instance_size_slug: basic-xxs
      http_port: 8080
      run_command: antre --bind 0.0.0.0 --port 8080 --no-tls
      health_check:
        http_path: /health
      envs:
        - key: ANTRE_DATA_DIR
          value: /data
        - key: ANTRE_DEPLOY_PLATFORM
          value: digitalocean
        - key: ANTRE_WEBAUTHN_RP_ID
          value: ${APP_DOMAIN}
        - key: ANTRE_WEBAUTHN_ORIGIN
          value: ${APP_URL}
