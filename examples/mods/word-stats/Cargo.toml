[package]
description       = "Demo mod: a word-count tool with persistent counters and a session hook"
edition.workspace = true
name              = "antre-mod-word-stats"
publish           = false
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json     = { workspace = true }
wit-bindgen    = { workspace = true }
wit-bindgen-rt = { workspace = true }

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "deny"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
