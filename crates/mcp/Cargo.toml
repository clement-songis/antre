[package]
edition.workspace = true
name              = "antre-mcp"
version.workspace = true

[features]
default = ["metrics"]
metrics = ["dep:antre-metrics"]

[dependencies]
antre-common  = { features = ["process"], workspace = true }
antre-config  = { workspace = true }
antre-metrics = { optional = true, workspace = true }
antre-oauth   = { workspace = true }
async-trait   = { workspace = true }
futures       = { workspace = true }
reqwest       = { workspace = true }
secrecy       = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tokio-util    = { features = ["codec"], workspace = true }
tracing       = { workspace = true }
url           = { workspace = true }
uuid          = { workspace = true }

[dev-dependencies]
mockito    = { workspace = true }
tempfile   = { workspace = true }
tokio-test = { workspace = true }
