[package]
edition.workspace    = true
name                 = "antre-web"
repository.workspace = true
version.workspace    = true

[dependencies]
antre-auth     = { workspace = true }
antre-channels = { workspace = true }
antre-config   = { workspace = true }
antre-cron     = { workspace = true }
antre-gateway  = { workspace = true }
antre-httpd    = { workspace = true }
antre-media    = { workspace = true }
antre-skills   = { workspace = true }
antre-tools    = { workspace = true }
askama         = { workspace = true }
axum           = { workspace = true }
axum-extra     = { features = ["cookie"], workspace = true }
base64         = { workspace = true }
chrono         = { features = ["serde"], workspace = true }
futures        = { workspace = true }
gix            = { workspace = true }
include_dir    = { optional = true, workspace = true }
portable-pty   = { workspace = true }
secrecy        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
sysinfo        = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }
tracing        = { workspace = true }
url            = { workspace = true }
uuid           = { workspace = true }
which          = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
agent              = ["antre-gateway/agent"]
bundled-skills     = ["antre-skills/bundled-skills"]
canvas             = ["antre-httpd/canvas"]
cloudflare-tunnel  = ["antre-httpd/cloudflare-tunnel"]
connectors         = ["antre-gateway/connectors", "antre-httpd/connectors"]
default            = ["embedded-assets"]
embedded-assets    = ["dep:include_dir"]
graphql            = ["antre-gateway/graphql", "antre-httpd/graphql"]
mdns               = ["antre-httpd/mdns"]
metrics            = ["antre-httpd/metrics"]
mods               = ["antre-gateway/mods"]
netbird            = ["antre-httpd/netbird"]
ngrok              = ["antre-httpd/ngrok"]
push-notifications = ["antre-httpd/push-notifications"]
slack              = ["antre-httpd/slack"]
tailscale          = ["antre-httpd/tailscale"]
tls                = ["antre-httpd/tls"]
trusted-network    = ["antre-httpd/trusted-network"]
vault              = ["antre-httpd/vault"]
voice              = ["antre-gateway/voice"]
web-ui             = ["antre-httpd/web-ui"]

[lints]
workspace = true
