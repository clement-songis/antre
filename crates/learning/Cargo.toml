[package]
description       = "Background learning loop: post-conversation review, skill curator, mutation ledger and write-approval staging"
edition.workspace = true
name              = "antre-learning"
version.workspace = true

[dependencies]
antre-config  = { workspace = true }
antre-metrics = { optional = true, workspace = true }
antre-skills  = { workspace = true }
async-trait   = { workspace = true }
hex           = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sha2          = { workspace = true }
similar       = { workspace = true }
thiserror     = { workspace = true }
time          = { features = ["formatting", "macros", "parsing", "serde"], workspace = true }
tokio         = { features = ["fs", "sync"], workspace = true }
tracing       = { optional = true, workspace = true }
uuid          = { workspace = true }

[features]
default = ["metrics", "tracing"]
metrics = ["dep:antre-metrics"]
tracing = ["dep:tracing"]

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { features = ["macros", "rt-multi-thread"], workspace = true }

[lints]
workspace = true
