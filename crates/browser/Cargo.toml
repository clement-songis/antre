[package]
edition.workspace = true
name              = "antre-browser"
version.workspace = true

[dependencies]
antre-common  = { workspace = true }
antre-config  = { workspace = true }
antre-metrics = { optional = true, workspace = true }
async-trait   = "0.1"
base64        = { workspace = true }
chromiumoxide = { default-features = false, features = ["tokio-runtime"], version = "0.8" }
futures       = { workspace = true }
rand          = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sysinfo       = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
url           = "2.5"
uuid          = { workspace = true }
which         = "8.0"

[dev-dependencies]
serial_test = { workspace = true }
tempfile    = { workspace = true }

[features]
default = []
metrics = ["dep:antre-metrics"]
tracing = []

[lints]
workspace = true
