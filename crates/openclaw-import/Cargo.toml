[package]
description       = "Import data from an existing OpenClaw installation into Antre"
edition.workspace = true
license.workspace = true
name              = "antre-openclaw-import"
version.workspace = true

[dependencies]
antre-common          = { workspace = true }
antre-config          = { workspace = true }
antre-oauth           = { workspace = true }
antre-sessions        = { workspace = true }
dirs-next             = { workspace = true }
json5                 = { workspace = true }
notify-debouncer-full = { optional = true, workspace = true }
rusqlite              = { workspace = true }
secrecy               = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
serde_yaml            = { workspace = true }
thiserror             = { workspace = true }
time                  = { features = ["parsing"], workspace = true }
tokio                 = { workspace = true }
toml                  = { workspace = true }
tracing               = { workspace = true }
walkdir               = { workspace = true }
zstd                  = { workspace = true }

[features]
default      = []
file-watcher = ["dep:notify-debouncer-full"]

[dev-dependencies]
notify-debouncer-full = { workspace = true }
tempfile              = { workspace = true }

[lints]
workspace = true
