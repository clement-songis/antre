[package]
edition.workspace = true
name              = "antre-observability"
version.workspace = true

[features]
default  = ["langfuse", "otlp"]
langfuse = ["otlp"]
metrics  = ["dep:antre-metrics"]
otlp     = []

[dependencies]
antre-common  = { workspace = true }
antre-config  = { workspace = true }
antre-metrics = { optional = true, workspace = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
base64        = { workspace = true }
futures       = { workspace = true }
rand          = { workspace = true }
reqwest       = { workspace = true }
secrecy       = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
time          = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
uuid          = { workspace = true }

[dev-dependencies]
tokio    = { features = ["full", "test-util"], workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
