[package]
description          = "Read-only Himalaya v2 adapter for Antre connectors"
edition.workspace    = true
license.workspace    = true
name                 = "antre-connector-himalaya"
repository.workspace = true
version.workspace    = true

[features]
default = ["tracing"]
metrics = ["dep:metrics"]
tracing = ["dep:tracing"]

[dependencies]
antre-agents     = { workspace = true }
antre-common     = { features = ["process"], workspace = true }
antre-connectors = { workspace = true }
anyhow           = { workspace = true }
async-trait      = { workspace = true }
mail-parser      = { workspace = true }
metrics          = { optional = true, workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sha2             = { workspace = true }
thiserror        = { workspace = true }
time             = { workspace = true }
tokio            = { features = ["io-util", "process", "sync", "time"], workspace = true }
tracing          = { optional = true, workspace = true }
which            = { workspace = true }

[dev-dependencies]
tokio = { features = ["macros", "rt-multi-thread"], workspace = true }

[lints]
workspace = true
