# Curated picks per provider and role, best first. Every id must exist in the
# bundled catalog (models.dev snapshot plus supplement.toml) and must not be
# deprecated: `recommended_ids_exist_and_are_active` fails CI otherwise.
#
# Chat entries seed pickers and the offline fallback list; the other roles
# replace model ids that features used to hard-code.

