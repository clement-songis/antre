# Curated picks per provider and role, best first. Every id must exist in the
# bundled catalog (models.dev snapshot plus supplement.toml) and must not be
# deprecated: `recommended_ids_exist_and_are_active` fails CI otherwise.
#
# Chat entries seed pickers and the offline fallback list; the other roles
# replace model ids that features used to hard-code.

[[role]]
kind     = "image"
models   = ["gpt-image-2.6-flare", "gpt-image-2.6-sunburst"]
provider = "openai"

[[role]]
kind     = "image"
models   = ["gemini-3-pro-image", "gemini-3.1-flash-lite-image"]
provider = "gemini"

[[role]]
kind     = "image"
models   = ["grok-imagine-image"]
provider = "xai"

[[role]]
kind     = "tts"
models   = ["gpt-4o-mini-tts"]
provider = "openai"

[[role]]
kind     = "stt"
models   = ["gpt-transcribe"]
provider = "openai"

[[role]]
kind     = "stt"
models   = ["voxtral-small-transcribe-latest"]
provider = "mistral"

[[role]]
kind     = "tts"
models   = ["gemini-3.8-flash-tts"]
provider = "gemini"

[[role]]
kind     = "stt"
models   = ["gemini-3.5-transcribe"]
provider = "gemini"

[[role]]
kind     = "rerank"
models   = ["rerank-v5.0-fast", "rerank-v5.0-pro"]
provider = "cohere"

[[role]]
kind     = "rerank"
models   = ["jina-reranker-v3"]
provider = "jina"

[[role]]
kind     = "rerank"
models   = ["rerank-3", "rerank-3-lite"]
provider = "voyage"

[[role]]
kind     = "chat"
models   = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5", "claude-fable-5-2"]
