[[role]]
kind     = "chat"
models   = ["grok-4.7", "grok-4.3"]
provider = "xai"

[[role]]
kind     = "chat"
models   = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]
provider = "groq"

[[role]]
