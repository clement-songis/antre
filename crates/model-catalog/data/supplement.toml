# ── Provider facts
# Z.AI prints quota reset times in China Standard Time without an offset.
[[provider_defaults]]
id            = "*"
provider      = "zai"
rate_limit_tz = "+08:00"

[[provider_defaults]]
id            = "*"
provider      = "zai-code"
rate_limit_tz = "+08:00"

