# ── Provider facts
# Z.AI prints quota reset times in China Standard Time without an offset.
[[provider_defaults]]
provider = "zai"
id = "*"
rate_limit_tz = "+08:00"

[[provider_defaults]]
provider = "zai-code"
id = "*"
rate_limit_tz = "+08:00"
