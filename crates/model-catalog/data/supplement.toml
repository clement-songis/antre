# Curated additions to the models.dev snapshot, merged into the bundled layer
# (a supplement row wins over models.dev for the fields it sets).
#
# Add a model here only when models.dev does not list it yet, or to record a
# fact models.dev has no field for. Sources: provider docs, see
# plans/research/providers-inventory.md (2026-11-27).

# ── OpenAI image generation (Responses image_generation tool / Images API)
[[models]]
display_name      = "GPT Image 2.6 Flare"
family            = "gpt-image"
id                = "gpt-image-2.6-flare"
input_modalities  = ["image", "text"]
kind              = "image"
output_modalities = ["image"]
provider          = "openai"

[[models]]
display_name      = "GPT Image 2.6 Sunburst"
family            = "gpt-image"
id                = "gpt-image-2.6-sunburst"
input_modalities  = ["image", "text"]
kind              = "image"
output_modalities = ["image"]
provider          = "openai"

