[package]
description       = "Model catalog: metadata for every provider model, merged from overrides, probes, live discovery, models.dev and heuristics"
edition.workspace = true
name              = "antre-model-catalog"
version.workspace = true

[dependencies]
antre-metrics = { optional = true, workspace = true }
flate2        = { workspace = true }
reqwest       = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
time          = { features = ["formatting", "macros", "parsing", "serde"], workspace = true }
tokio         = { workspace = true }
toml          = { workspace = true }
tracing       = { optional = true, workspace = true }

[features]
default = ["metrics", "tracing"]
metrics = ["dep:antre-metrics"]
tracing = ["dep:tracing"]

[dev-dependencies]
mockito  = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
