[package]
edition.workspace = true
name              = "antre-plugins"
version.workspace = true

[dependencies]
antre-common   = { workspace = true }
antre-config   = { workspace = true }
antre-metrics  = { optional = true, workspace = true }
antre-sessions = { workspace = true }
async-trait    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
time           = { workspace = true }
tokio          = { workspace = true }
toml           = { workspace = true }
tracing        = { workspace = true }

[features]
default = []
metrics = ["dep:antre-metrics"]

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { features = ["macros", "rt"], workspace = true }

[lints]
workspace = true
