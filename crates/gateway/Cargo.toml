[package]
edition.workspace    = true
name                 = "antre-gateway"
repository.workspace = true
version.workspace    = true

[dependencies]
antre-agents             = { workspace = true }
antre-auth               = { workspace = true }
antre-browser            = { workspace = true }
antre-caldav             = { optional = true, workspace = true }
antre-canvas             = { optional = true, workspace = true }
antre-channels           = { workspace = true }
antre-chat               = { workspace = true }
antre-claude-import      = { optional = true, workspace = true }
antre-code-index         = { workspace = true }
antre-codex-import       = { optional = true, workspace = true }
antre-common             = { workspace = true }
antre-config             = { workspace = true }
antre-connector-caldav   = { optional = true, workspace = true }
antre-connector-gmail    = { optional = true, workspace = true }
antre-connector-himalaya = { optional = true, workspace = true }
antre-connectors         = { optional = true, workspace = true }
antre-cron               = { workspace = true }
antre-delivery           = { workspace = true }
antre-discord            = { optional = true, workspace = true }
antre-external-agents    = { workspace = true }
antre-hermes-import      = { optional = true, workspace = true }
antre-home-assistant     = { optional = true, workspace = true }
antre-learning           = { workspace = true }
antre-matrix             = { optional = true, workspace = true }
antre-mcp                = { workspace = true }
antre-mcp-agent-bridge   = { workspace = true }
antre-media              = { workspace = true }
antre-memory             = { workspace = true }
antre-memory-zvec        = { optional = true, workspace = true }
antre-metrics            = { optional = true, workspace = true }
antre-model-catalog      = { workspace = true }
antre-mods               = { optional = true, workspace = true }
antre-msteams            = { optional = true, workspace = true }
antre-netbird            = { optional = true, workspace = true }
antre-network-filter     = { features = ["proxy", "service"], optional = true, workspace = true }
antre-nostr              = { optional = true, workspace = true }
antre-oauth              = { workspace = true }
antre-observability      = { workspace = true }
antre-onboarding         = { workspace = true }
antre-openclaw-import    = { optional = true, workspace = true }
antre-plugins            = { workspace = true }
antre-projects           = { workspace = true }
antre-protocol           = { workspace = true }
antre-provider-setup     = { workspace = true }
antre-providers          = { workspace = true }
antre-qmd                = { optional = true, workspace = true }
antre-routing            = { workspace = true }
antre-secret-store       = { workspace = true }
antre-service-traits     = { workspace = true }
antre-sessions           = { workspace = true }
antre-signal             = { optional = true, workspace = true }
antre-skills             = { workspace = true }
antre-slack              = { optional = true, workspace = true }
antre-tailscale          = { optional = true, workspace = true }
antre-telegram           = { optional = true, workspace = true }
antre-telephony          = { optional = true, workspace = true }
antre-tools              = { workspace = true }
antre-vault              = { optional = true, workspace = true }
antre-voice              = { optional = true, workspace = true }
antre-webhooks           = { workspace = true }
antre-whatsapp           = { optional = true, workspace = true }
anyhow                   = { workspace = true }
async-trait              = { workspace = true }
base64                   = { workspace = true }
bytes                    = { workspace = true }
cap-fs-ext               = { workspace = true }
cap-std                  = { workspace = true }
chrono                   = { features = ["serde"], optional = true, workspace = true }
chrono-tz                = { workspace = true }
dashmap                  = { workspace = true }
ed25519-dalek            = { workspace = true }
flate2                   = { workspace = true }
futures                  = { workspace = true }
gix                      = { workspace = true }
hostname                 = { workspace = true }
http                     = { workspace = true }
include_dir              = { optional = true, workspace = true }
isahc                    = { optional = true, workspace = true }
mdns-sd                  = { optional = true, workspace = true }
p256                     = { features = ["ecdsa"], optional = true, workspace = true }
portable-pty             = { optional = true, workspace = true }
pulldown-cmark           = { features = ["html"], workspace = true }
qrcode                   = { optional = true, workspace = true }
rand                     = { workspace = true }
reqwest                  = { workspace = true }
rustix                   = { workspace = true }
secrecy                  = { workspace = true }
serde                    = { workspace = true }
serde_json               = { workspace = true }
sha2                     = { workspace = true }
shell-words              = { workspace = true }
sqlx                     = { workspace = true }
sysinfo                  = { workspace = true }
tar                      = { workspace = true }
tempfile                 = { workspace = true }
thiserror                = { workspace = true }
time                     = { workspace = true }
tokio                    = { workspace = true }
tokio-stream             = { workspace = true }
tokio-util               = { features = ["rt"], workspace = true }
toml                     = { workspace = true }
tracing                  = { workspace = true }
tracing-subscriber       = { workspace = true }
url                      = { workspace = true }
urlencoding              = { workspace = true }
uuid                     = { workspace = true }
web-push                 = { optional = true, workspace = true }
webauthn-rs              = { features = ["danger-allow-state-serialisation"], workspace = true }
which                    = { optional = true, workspace = true }

[features]
agent = []
bundled-skills = [
  "antre-chat/bundled-skills",
  "antre-skills/bundled-skills",
  "antre-tools/bundled-skills",
]
caldav = ["dep:antre-caldav"]
canvas = ["dep:antre-canvas"]
claude-import = ["dep:antre-claude-import"]
code-index-builtin = ["antre-code-index/builtin"]
codex-import = ["dep:antre-codex-import"]
connectors = [
  "dep:antre-caldav",
  "dep:antre-connector-caldav",
  "dep:antre-connector-gmail",
  "dep:antre-connector-himalaya",
  "dep:antre-connectors",
]
default = [
  "agent",
  "bundled-skills",
  "caldav",
  "canvas",
  "claude-import",
  "code-index-builtin",
  "codex-import",
  "connectors",
  "discord",
  "file-watcher",
  "firecrawl",
  "fs-tools",
  "graphql",
  "hermes-import",
  "home-assistant",
  "langfuse",
  "local-llm",
  "local-llm-metal",
  "matrix",
  "mdns",
  "metrics",
  "msteams",
  "netbird",
  "nostr",
  "openclaw-import",
  "otlp",
  "prometheus",
  "provider-github-copilot",
  "provider-kimi-code",
  "provider-openai-codex",
  "push-notifications",
  "qmd",
  "signal",
  "slack",
  "tailscale",
  "telegram",
  "telephony",
  "tls",
  "trusted-network",
  "vault",
  "voice",
  "wasm",
  "web-ui",
  "whatsapp",
]
discord = ["dep:antre-discord"]
file-watcher = [
  "antre-code-index/file-watcher",
  "antre-memory/file-watcher",
  "antre-openclaw-import?/file-watcher",
  "antre-skills/file-watcher",
]
firecrawl = ["antre-tools/firecrawl"]
fs-tools = ["antre-tools/fs-tools"]
graphql = []
hermes-import = ["dep:antre-hermes-import"]
home-assistant = ["dep:antre-home-assistant"]
langfuse = ["antre-observability/langfuse"]
llm-compaction = ["antre-chat/llm-compaction"]
local-embeddings = ["antre-memory/local-embeddings"]
local-llm = ["antre-chat/local-llm", "antre-provider-setup/local-llm", "antre-providers/local-llm"]
local-llm-cuda = ["antre-providers/local-llm-cuda", "local-llm"]
local-llm-metal = ["antre-providers/local-llm-metal", "local-llm"]
local-llm-vulkan = ["antre-providers/local-llm-vulkan", "local-llm"]
matrix = ["dep:antre-matrix"]
mdns = ["dep:mdns-sd"]
metrics = [
  "antre-canvas?/metrics",
  "antre-chat/metrics",
  "antre-connector-caldav?/metrics",
  "antre-connector-gmail?/metrics",
  "antre-connector-himalaya?/metrics",
  "antre-connectors?/metrics",
  "antre-discord?/metrics",
  "antre-matrix?/metrics",
  "antre-metrics/sqlite",
  "antre-msteams?/metrics",
  "antre-nostr?/metrics",
  "antre-observability/metrics",
  "antre-signal?/metrics",
  "dep:antre-metrics",
]
mods = ["dep:antre-mods", "wasm"]
msteams = ["dep:antre-msteams"]
netbird = ["dep:antre-netbird"]
nostr = ["dep:antre-nostr"]
openclaw-import = ["dep:antre-openclaw-import"]
otlp = ["antre-observability/otlp"]
prometheus = ["antre-metrics/prometheus", "metrics"]
provider-github-copilot = [
  "antre-provider-setup/provider-github-copilot",
  "antre-providers/provider-github-copilot",
]
provider-kimi-code = ["antre-providers/provider-kimi-code"]
provider-openai-codex = [
  "antre-providers/provider-openai-codex",
  "antre-tools/provider-openai-codex",
]
push-notifications = [
  "antre-chat/push-notifications",
  "dep:chrono",
  "dep:isahc",
  "dep:p256",
  "dep:web-push",
]
qmd = ["antre-code-index/qmd", "dep:antre-qmd"]
signal = ["dep:antre-signal"]
slack = ["antre-slack/metrics", "dep:antre-slack"]
tailscale = ["dep:antre-tailscale"]
telegram = ["antre-chat/telegram", "dep:antre-telegram"]
telephony = ["dep:antre-telephony"]
tls = []
trusted-network = ["dep:antre-network-filter"]
vault = [
  "antre-auth/vault",
  "antre-provider-setup/vault",
  "antre-secret-store/vault",
  "dep:antre-vault",
]
voice = ["dep:antre-voice"]
wasm = ["antre-tools/wasm"]
web-ui = ["antre-chat/web-ui", "dep:include_dir", "dep:portable-pty", "dep:which"]
whatsapp = ["antre-whatsapp/metrics", "dep:antre-whatsapp", "dep:qrcode"]
zvec = ["dep:antre-memory-zvec"]

[dev-dependencies]
serial_test = { workspace = true }
tokio       = { features = ["test-util"], workspace = true }

[lints]
workspace = true
