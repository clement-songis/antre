[package]
description       = "Personal AI gateway inspired by OpenClaw"
edition.workspace = true
homepage          = "https://www.moltis.org/"
license           = "MIT"
name              = "antre"
repository        = "https://github.com/antre-ai/antre"
version.workspace = true

[package.metadata.deb]
assets = [
  [
    "target/release/antre",
    "usr/bin/",
    "755",
  ],
  [
    "../web/src/assets/**/*",
    "usr/share/antre/web/",
    "644",
  ],
  [
    "../../docs/src/**/*",
    "usr/share/antre/docs/",
    "644",
  ],
  [
    "target/release/antre_wasm_calc.wasm",
    "usr/share/antre/wasm/",
    "644",
  ],
  [
    "target/release/antre_wasm_web_fetch.wasm",
    "usr/share/antre/wasm/",
    "644",
  ],
  [
    "target/release/antre_wasm_web_search.wasm",
    "usr/share/antre/wasm/",
    "644",
  ],
]
copyright = "2025, Antre Contributors"
depends = "$auto"
maintainer = "Antre Contributors"
name = "antre"
priority = "optional"
section = "net"

[package.metadata.generate-rpm]
assets = [
  { dest = "/usr/bin/antre", mode = "0755", source = "target/release/antre" },
  { dest = "/usr/share/antre/docs/", mode = "0644", source = "docs/src/**/*" },
  { dest = "/usr/share/antre/wasm/", mode = "0644", source = "target/wasm32-wasip2/release/antre_wasm_calc.wasm" },
  { dest = "/usr/share/antre/wasm/", mode = "0644", source = "target/wasm32-wasip2/release/antre_wasm_web_fetch.wasm" },
  { dest = "/usr/share/antre/wasm/", mode = "0644", source = "target/wasm32-wasip2/release/antre_wasm_web_search.wasm" },
  { dest = "/usr/share/antre/web/", mode = "0644", source = "crates/web/src/assets/**/*" },
]
license = "MIT"
name = "antre"
summary = "Personal AI gateway inspired by OpenClaw"
url = "https://www.moltis.org/"

[[bin]]
name = "antre"
path = "src/main.rs"

[dependencies]
agent-client-protocol  = { optional = true, workspace = true }
antre-acp              = { optional = true, workspace = true }
antre-agents           = { workspace = true }
antre-browser          = { workspace = true }
antre-chat             = { optional = true, workspace = true }
antre-claude-import    = { optional = true, workspace = true }
antre-codex-import     = { optional = true, workspace = true }
antre-common           = { workspace = true }
antre-config           = { workspace = true }
antre-connectors       = { optional = true, workspace = true }
antre-cron             = { workspace = true }
antre-gateway          = { workspace = true }
antre-hermes-import    = { optional = true, workspace = true }
antre-httpd            = { workspace = true }
antre-import-core      = { workspace = true }
antre-mcp              = { optional = true, workspace = true }
antre-mcp-agent-bridge = { optional = true, workspace = true }
antre-memory           = { workspace = true }
antre-memory-zvec      = { optional = true, workspace = true }
antre-node-host        = { workspace = true }
antre-oauth            = { workspace = true }
antre-onboarding       = { workspace = true }
antre-openclaw-import  = { optional = true, workspace = true }
antre-plugins          = { workspace = true }
antre-portable         = { workspace = true }
antre-projects         = { workspace = true }
antre-protocol         = { workspace = true }
antre-providers        = { workspace = true }
antre-service-traits   = { optional = true, workspace = true }
antre-sessions         = { workspace = true }
antre-skills           = { workspace = true }
antre-tools            = { workspace = true }
antre-web              = { optional = true, workspace = true }
anyhow                 = { workspace = true }
async-trait            = { workspace = true }
clap                   = { workspace = true }
dotenvy                = { workspace = true }
indicatif              = { workspace = true }
open                   = { workspace = true }
rand                   = { workspace = true }
reqwest                = { workspace = true }
secrecy                = { workspace = true }
serde_json             = { workspace = true }
sqlx                   = { workspace = true }
time                   = { workspace = true }
tokio                  = { workspace = true }
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }
uuid                   = { workspace = true }
which                  = { workspace = true }

[target.'cfg(all(not(target_os = "windows"), not(all(target_os = "linux", target_arch = "aarch64"))))'.dependencies]
tikv-jemallocator = { optional = true, workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile    = { workspace = true }

[features]
acp = [
  "dep:agent-client-protocol",
  "dep:antre-acp",
  "dep:antre-chat",
  "dep:antre-mcp",
  "dep:antre-mcp-agent-bridge",
  "dep:antre-service-traits",
]
agent = ["antre-gateway/agent", "antre-web?/agent"]
caldav = ["antre-gateway/caldav"]
canvas = ["antre-gateway/canvas", "antre-httpd/canvas", "antre-web?/canvas"]
cloudflare-tunnel = ["antre-httpd/cloudflare-tunnel", "antre-web?/cloudflare-tunnel"]
connectors = [
  "antre-gateway/connectors",
  "antre-httpd/connectors",
  "antre-web?/connectors",
  "dep:antre-connectors",
]
home-assistant = ["antre-gateway/home-assistant"]
# User-facing integrations stay default-on in the CLI crate per workspace policy,
# even when the underlying implementation remains feature-gated in lower crates.
#
# `portable` is the self-contained feature set used by release packages. `full`
# adds zvec for source and container builds, where its native runtime can be
# provided. Both exclude build-mode toggles (`embedded-*`) and accelerator-
# specific features (`local-llm-cuda`, `local-llm-vulkan`).
bundled-skills = ["antre-gateway/bundled-skills", "antre-web?/bundled-skills"]
default = ["full"]
full = ["portable", "zvec"]
llm-compaction = ["antre-gateway/llm-compaction"]
mods = ["antre-gateway/mods", "antre-web?/mods"]
portable = [
  "acp",
  "agent",
  "bundled-skills",
  "caldav",
  "canvas",
  "claude-import",
  "cloudflare-tunnel",
  "code-index-builtin",
  "code-splitter",
  "codex-import",
  "connectors",
  "discord",
  "file-watcher",
  "firecrawl",
  "fs-tools",
  "graphql",
  "hermes-import",
  "home-assistant",
  "jemalloc",
  "lang-bash",
  "lang-c",
  "lang-cpp",
  "lang-css",
  "lang-go",
  "lang-html",
  "lang-java",
  "lang-javascript",
  "lang-json",
  "lang-markdown",
  "lang-python",
  "lang-ruby",
  "lang-rust",
  "lang-toml",
  "lang-typescript",
  "langfuse",
  "llm-compaction",
  "local-embeddings",
  "local-llm",
  "local-llm-metal",
  "matrix",
  "mdns",
  "metrics",
  "mods",
  "msteams",
  "netbird",
  "ngrok",
  "nostr",
  "openclaw-import",
  "os-sandbox",
  "otlp",
  "prometheus",
  "provider-github-copilot",
  "provider-kimi-code",
  "provider-openai-codex",
  "push-notifications",
  "qmd",
  "signal",
  "slack",
  "tailscale",
  "telegram",
  "telephony",
  "tls",
  "trusted-network",
  "vault",
  "vercel-sandbox",
  "voice",
  "wasm",
  "web-ui",
  "whatsapp",
]
# Minimal build for memory-constrained devices (Raspberry Pi, etc.).
# Build with: cargo build --release --no-default-features --features lightweight
code-index-builtin = ["antre-gateway/code-index-builtin"]
code-splitter      = ["antre-memory/code-splitter"]
discord            = ["antre-httpd/discord"]
embedded-assets    = ["antre-web?/embedded-assets"]
embedded-wasm      = ["antre-tools/embedded-wasm"]
file-watcher       = ["antre-gateway/file-watcher"]
firecrawl          = ["antre-gateway/firecrawl"]
fs-tools           = ["antre-gateway/fs-tools"]
graphql            = ["antre-httpd/graphql", "antre-web?/graphql"]
jemalloc           = ["dep:tikv-jemallocator"]
lang-bash          = ["antre-memory/lang-bash"]
lang-c             = ["antre-memory/lang-c"]
lang-cpp           = ["antre-memory/lang-cpp"]
lang-css           = ["antre-memory/lang-css"]
lang-go            = ["antre-memory/lang-go"]
lang-html          = ["antre-memory/lang-html"]
lang-java          = ["antre-memory/lang-java"]
lang-javascript    = ["antre-memory/lang-javascript"]
lang-json          = ["antre-memory/lang-json"]
lang-markdown      = ["antre-memory/lang-markdown"]
lang-python        = ["antre-memory/lang-python"]
lang-ruby          = ["antre-memory/lang-ruby"]
lang-rust          = ["antre-memory/lang-rust"]
lang-toml          = ["antre-memory/lang-toml"]
lang-typescript    = ["antre-memory/lang-typescript"]
# jemalloc is intentionally unavailable on linux/aarch64 to avoid runtime
# crashes on 16 KiB page kernels (e.g. Raspberry Pi OS variants).
claude-import = ["antre-gateway/claude-import", "dep:antre-claude-import"]
codex-import  = ["antre-gateway/codex-import", "dep:antre-codex-import"]
hermes-import = ["antre-gateway/hermes-import", "dep:antre-hermes-import"]
# Instrumentation exporters. Default-on so the `[instrumentation]` config can be
# switched on without a rebuild; enabling the config, not the feature, is what
# starts sending data. `langfuse` implies `otlp`: Langfuse ingests traces over
# the OTLP wire format.
langfuse = ["antre-gateway/langfuse"]
lightweight = ["jemalloc", "tls", "web-ui"]
local-embeddings = ["antre-gateway/local-embeddings"]
local-llm = ["antre-gateway/local-llm"]
local-llm-cuda = ["antre-gateway/local-llm-cuda", "local-llm"]
local-llm-metal = ["antre-gateway/local-llm-metal", "local-llm"]
local-llm-vulkan = ["antre-gateway/local-llm-vulkan", "local-llm"]
matrix = ["antre-httpd/matrix"]
mdns = ["antre-gateway/mdns"]
metrics = ["antre-httpd/metrics", "antre-web?/metrics"]
msteams = ["antre-httpd/msteams"]
netbird = ["antre-httpd/netbird", "antre-web?/netbird"]
ngrok = ["antre-httpd/ngrok", "antre-web?/ngrok"]
nostr = ["antre-httpd/nostr"]
openclaw-import = ["antre-gateway/openclaw-import", "dep:antre-openclaw-import"]
os-sandbox = ["antre-tools/os-sandbox"]
otlp = ["antre-gateway/otlp"]
prometheus = ["antre-httpd/prometheus"]
provider-github-copilot = [
  "antre-gateway/provider-github-copilot",
  "antre-providers/provider-github-copilot",
]
provider-kimi-code = ["antre-gateway/provider-kimi-code", "antre-providers/provider-kimi-code"]
provider-openai-codex = ["antre-gateway/provider-openai-codex"]
push-notifications = ["antre-httpd/push-notifications", "antre-web?/push-notifications"]
qmd = ["antre-gateway/qmd"]
signal = ["antre-httpd/signal"]
slack = ["antre-httpd/slack"]
tailscale = ["antre-httpd/tailscale", "antre-web?/tailscale"]
telegram = ["antre-gateway/telegram"]
telephony = ["antre-httpd/telephony"]
tls = ["antre-httpd/tls"]
trusted-network = ["antre-httpd/trusted-network"]
vault = ["antre-httpd/vault", "antre-web?/vault"]
vercel-sandbox = ["antre-tools/vercel-sandbox"]
voice = ["antre-gateway/voice", "antre-web?/voice"]
wasm = ["antre-tools/wasm"]
web-ui = ["antre-httpd/web-ui", "dep:antre-web"]
whatsapp = ["antre-gateway/whatsapp"]
zvec = ["antre-gateway/zvec", "dep:antre-memory-zvec"]

[lints]
workspace = true
