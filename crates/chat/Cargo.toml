[package]
edition.workspace    = true
name                 = "antre-chat"
repository.workspace = true
version.workspace    = true

[dependencies]
antre-agents         = { workspace = true }
antre-channels       = { workspace = true }
antre-common         = { workspace = true }
antre-config         = { workspace = true }
antre-delivery       = { workspace = true }
antre-memory         = { workspace = true }
antre-metrics        = { optional = true, workspace = true }
antre-observability  = { workspace = true }
antre-plugins        = { workspace = true }
antre-projects       = { workspace = true }
antre-providers      = { workspace = true }
antre-service-traits = { workspace = true }
antre-sessions       = { workspace = true }
antre-skills         = { workspace = true }
antre-telegram       = { optional = true, workspace = true }
antre-tools          = { workspace = true }
antre-voice          = { workspace = true }
anyhow               = { workspace = true }
async-trait          = { workspace = true }
base64               = { workspace = true }
chrono               = { features = ["serde"], workspace = true }
chrono-tz            = { workspace = true }
futures              = { workspace = true }
html2text            = { workspace = true }
pulldown-cmark       = { workspace = true }
rand                 = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
thiserror            = { workspace = true }
time                 = { features = ["macros", "serde"], workspace = true }
tokio                = { workspace = true }
tokio-stream         = { workspace = true }
tokio-util           = { workspace = true }
tracing              = { workspace = true }
uuid                 = { workspace = true }

[features]
# Enable the LLM-backed compaction modes (`structured` and `llm_replace`).
# Default-on so users get full compaction out of the box. Disabling this
# removes the streaming-summary path and LLM modes become a runtime config
# error; the `deterministic` and `recency_preserving` modes remain available.
bundled-skills     = ["antre-skills/bundled-skills"]
llm-compaction     = []
local-llm          = []
metrics            = ["antre-delivery/metrics", "antre-metrics/sqlite", "dep:antre-metrics"]
push-notifications = []
telegram           = ["dep:antre-telegram"]
web-ui             = []

default = ["llm-compaction"]

[dev-dependencies]
antre-channels = { workspace = true }
antre-protocol = { workspace = true }
async-stream   = { workspace = true }
sqlx           = { workspace = true }
tempfile       = { workspace = true }
tokio          = { workspace = true }
toml           = { workspace = true }

[lints]
workspace = true
