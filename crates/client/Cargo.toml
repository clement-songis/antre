[package]
description       = "Network client for a running Antre daemon (WebSocket RPC v4, auth, discovery)"
edition.workspace = true
license.workspace = true
name              = "antre-client"
version.workspace = true

[dependencies]
antre-config             = { optional = true, workspace = true }
antre-metrics            = { optional = true, workspace = true }
antre-protocol           = { workspace = true }
futures                  = { workspace = true }
mdns-sd                  = { optional = true, workspace = true }
reqwest                  = { workspace = true }
rustls                   = { workspace = true }
rustls-platform-verifier = { workspace = true }
secrecy                  = { workspace = true }
serde                    = { workspace = true }
serde_json               = { workspace = true }
sha2                     = { workspace = true }
thiserror                = { workspace = true }
tokio                    = { workspace = true }
tokio-rustls             = { workspace = true }
tokio-tungstenite        = { features = ["rustls-tls-webpki-roots"], workspace = true }
tracing                  = { optional = true, workspace = true }
url                      = { features = ["serde"], workspace = true }
uuid                     = { workspace = true }

[dev-dependencies]
axum     = { workspace = true }
rcgen    = { features = ["x509-parser"], workspace = true }
tempfile = { workspace = true }
tokio    = { features = ["macros", "rt-multi-thread", "test-util"], workspace = true }

[features]
default = ["local", "metrics", "tracing"]
# Find the daemon configured on this machine through `antre.toml`.
local = ["dep:antre-config"]
# Browse `_antre._tcp.local.` for daemons on the local network.
mdns    = ["dep:mdns-sd"]
metrics = ["dep:antre-metrics"]
tracing = ["dep:tracing"]
# Forward a remote daemon's loopback port through the system `ssh`.
ssh = ["tokio/process"]

[lints]
workspace = true
