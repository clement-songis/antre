[package]
description          = "Home Assistant integration for Antre"
edition.workspace    = true
name                 = "antre-home-assistant"
repository.workspace = true
version.workspace    = true

[dependencies]
antre-agents      = { workspace = true }
antre-config      = { workspace = true }
antre-metrics     = { optional = true, workspace = true }
anyhow            = { workspace = true }
async-trait       = { workspace = true }
bytes             = { workspace = true }
futures-util      = { workspace = true }
reqwest           = { workspace = true }
secrecy           = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tokio             = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing           = { workspace = true }
urlencoding       = { workspace = true }

[dev-dependencies]
dotenvy    = { workspace = true }
secrecy    = { workspace = true }
serde_json = { workspace = true }
time       = { workspace = true }
tokio      = { features = ["macros", "rt-multi-thread", "test-util", "time"], workspace = true }
wiremock   = { workspace = true }

[features]
default = ["tracing"]
metrics = ["dep:antre-metrics"]
tracing = []

[lints]
workspace = true
