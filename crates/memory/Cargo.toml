[package]
edition.workspace = true
name              = "antre-memory"
version.workspace = true

[features]
default = ["file-watcher"]
# Re-export code-splitter features from antre-splitter for downstream compatibility.
code-splitter      = ["antre-splitter/code-splitter"]
code-splitter-base = ["antre-splitter/code-splitter-base"]
lang-bash          = ["antre-splitter/lang-bash"]
lang-c             = ["antre-splitter/lang-c"]
lang-cpp           = ["antre-splitter/lang-cpp"]
lang-css           = ["antre-splitter/lang-css"]
lang-go            = ["antre-splitter/lang-go"]
lang-html          = ["antre-splitter/lang-html"]
lang-java          = ["antre-splitter/lang-java"]
lang-javascript    = ["antre-splitter/lang-javascript"]
lang-json          = ["antre-splitter/lang-json"]
lang-markdown      = ["antre-splitter/lang-markdown"]
lang-python        = ["antre-splitter/lang-python"]
lang-ruby          = ["antre-splitter/lang-ruby"]
lang-rust          = ["antre-splitter/lang-rust"]
lang-toml          = ["antre-splitter/lang-toml"]
lang-typescript    = ["antre-splitter/lang-typescript"]
# Existing features.
file-watcher     = ["dep:notify-debouncer-full"]
local-embeddings = ["dep:llama-cpp-2"]
metrics          = ["dep:antre-metrics"]

[dependencies]
antre-agents          = { workspace = true }
antre-common          = { workspace = true }
antre-config          = { workspace = true }
antre-metrics         = { optional = true, workspace = true }
antre-splitter        = { workspace = true }
antre-tools           = { workspace = true }
anyhow                = { workspace = true }
async-trait           = { workspace = true }
bytemuck              = { workspace = true }
chrono                = { features = ["serde"], workspace = true }
directories.workspace = true
futures               = { workspace = true }
llama-cpp-2           = { optional = true, workspace = true }
notify-debouncer-full = { optional = true, workspace = true }
reqwest               = { workspace = true }
secrecy               = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
sha2                  = { workspace = true }
sqlx                  = { workspace = true }
thiserror             = { workspace = true }
tokio                 = { workspace = true }
tracing               = { workspace = true }
walkdir               = { workspace = true }

[dev-dependencies]
mockito  = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
