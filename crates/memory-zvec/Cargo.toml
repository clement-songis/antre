[package]
description       = "Zvec vector database backend for antre memory"
edition.workspace = true
name              = "antre-memory-zvec"
version.workspace = true

[dependencies]
antre-memory  = { path = "../memory" }
antre-metrics = { optional = true, workspace = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
futures       = { workspace = true }
half          = { workspace = true }
hex           = { workspace = true }
redb          = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sha2          = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
zvec          = { workspace = true }
zvec-sys      = { workspace = true }

[features]
default = ["tracing"]
metrics = ["dep:antre-metrics"]
tracing = []

[lints]
workspace = true

[dev-dependencies]
anyhow   = { workspace = true }
sqlx     = { workspace = true }
tempfile = { workspace = true }
tokio    = { workspace = true }
