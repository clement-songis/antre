[package]
edition.workspace = true
name              = "antre-network-filter"
version.workspace = true

[features]
default = ["metrics", "proxy", "service"]
metrics = ["dep:antre-metrics"]
proxy   = ["dep:uuid"]
service = []

[dependencies]
antre-metrics = { optional = true, workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
time          = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
uuid          = { optional = true, workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { features = ["macros", "rt-multi-thread"], workspace = true }

[lints]
workspace = true
