[package]
edition.workspace = true
name              = "antre-canvas"
version.workspace = true

[dependencies]
antre-agents  = { workspace = true }
antre-browser = { workspace = true }
antre-common  = { workspace = true }
antre-config  = { workspace = true }
antre-metrics = { optional = true, workspace = true }
antre-tools   = { workspace = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
axum          = { workspace = true }
base64        = { workspace = true }
hex           = { workspace = true }
hmac          = { workspace = true }
mime_guess    = { workspace = true }
rand          = { workspace = true }
regex         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sha2          = { workspace = true }
sqlx          = { workspace = true }
thiserror     = { workspace = true }
time          = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
uuid          = { workspace = true }
walkdir       = { workspace = true }
zip           = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower    = { features = ["util"], workspace = true }

[features]
default = ["tracing"]
metrics = ["antre-browser/metrics", "dep:antre-metrics"]
tracing = []

[lints]
workspace = true
