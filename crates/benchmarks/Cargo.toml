[package]
edition.workspace    = true
license.workspace    = true
name                 = "benchmarks"
repository.workspace = true
version.workspace    = true

[dependencies]
antre-agents      = { workspace = true }
antre-code-index  = { workspace = true }
antre-config      = { workspace = true }
antre-memory      = { workspace = true }
antre-memory-zvec = { optional = true, workspace = true }
antre-providers   = { workspace = true }
antre-qmd         = { optional = true, workspace = true }
antre-sessions    = { workspace = true }
grep-regex        = { workspace = true }
grep-searcher     = { workspace = true }
rand              = { workspace = true }
serde_json        = { workspace = true }
sqlx              = { workspace = true }
tempfile          = { workspace = true }
tokio             = { workspace = true }
toml              = { workspace = true }

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "4.3" }

[[bench]]
harness = false
name    = "boot"

[[bench]]
harness = false
name    = "code_index"

[[bench]]
harness = false
name    = "memory_backends"

[features]
qmd  = ["dep:antre-qmd"]
zvec = ["dep:antre-memory-zvec"]

[lints]
workspace = true
