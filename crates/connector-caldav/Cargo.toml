[package]
description          = "CalDAV provider adapter for Antre connectors"
edition.workspace    = true
license.workspace    = true
name                 = "antre-connector-caldav"
repository.workspace = true
version.workspace    = true

[features]
default = ["tracing"]
metrics = ["dep:metrics"]
tracing = ["dep:tracing"]

[dependencies]
antre-caldav     = { workspace = true }
antre-common     = { workspace = true }
antre-connectors = { workspace = true }
async-trait      = { workspace = true }
metrics          = { optional = true, workspace = true }
secrecy          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sha2             = { workspace = true }
thiserror        = { workspace = true }
time             = { features = ["parsing"], workspace = true }
tokio            = { features = ["macros", "net", "rt"], workspace = true }
tracing          = { optional = true, workspace = true }
url              = { workspace = true }

[lints]
workspace = true
