[package]
edition.workspace      = true
license.workspace      = true
name                   = "antre-swift-bridge"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lib]
crate-type = ["staticlib"]

[features]
default         = ["metrics", "qmd", "tracing", "trusted-network"]
metrics         = ["dep:metrics"]
qmd             = ["antre-gateway/qmd"]
tracing         = ["dep:tracing"]
trusted-network = ["antre-httpd/trusted-network"]

[dependencies]
antre-agents         = { workspace = true }
antre-config         = { workspace = true }
antre-gateway        = { default-features = true, features = ["file-watcher", "metrics", "voice", "web-ui"], workspace = true }
antre-httpd          = { workspace = true }
antre-network-filter = { features = ["proxy", "service"], workspace = true }
antre-projects       = { workspace = true }
antre-provider-setup = { workspace = true }
antre-providers      = { workspace = true }
antre-sessions       = { workspace = true }
antre-tools          = { features = ["embedded-wasm"], workspace = true }
antre-web            = { workspace = true }
anyhow               = { workspace = true }
axum                 = { workspace = true }
metrics              = { optional = true, workspace = true }
secrecy              = { workspace = true }
serde                = { features = ["derive"], workspace = true }
serde_json           = { workspace = true }
sqlx                 = { workspace = true }
tokio                = { workspace = true }
tokio-stream         = { workspace = true }
tracing              = { optional = true, workspace = true }
uuid                 = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
