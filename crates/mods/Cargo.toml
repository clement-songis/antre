[package]
description       = "Mod SDK runtime: manifests, capabilities, consent, contribution registry and the WASM mod host"
edition.workspace = true
name              = "moltis-mods"
version.workspace = true

[features]
default = ["metrics", "tracing", "wasm"]
metrics = ["dep:moltis-metrics"]
tracing = []
wasm    = ["dep:moltis-tools", "dep:wasmtime", "dep:wasmtime-wasi", "moltis-tools/wasm"]

[dependencies]
anyhow         = { workspace = true }
async-trait    = { workspace = true }
hex            = { workspace = true }
moltis-agents  = { workspace = true }
moltis-common  = { workspace = true }
moltis-metrics = { optional = true, workspace = true }
moltis-tools   = { optional = true, workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
sha2           = { workspace = true }
thiserror      = { workspace = true }
time           = { workspace = true }
tokio          = { workspace = true }
toml           = { workspace = true }
tracing        = { workspace = true }
walkdir        = { workspace = true }
wasmtime       = { optional = true, workspace = true }
wasmtime-wasi  = { optional = true, workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { features = ["macros", "rt-multi-thread"], workspace = true }
wat      = { workspace = true }

[lints]
workspace = true
