[package]
description       = "Mod SDK runtime: manifests, capabilities, consent, contribution registry and the WASM mod host"
edition.workspace = true
name              = "antre-mods"
version.workspace = true

[features]
default = ["metrics", "tracing", "wasm"]
metrics = ["dep:antre-metrics"]
tracing = []
wasm    = ["antre-tools/wasm", "dep:antre-tools", "dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
antre-agents  = { workspace = true }
antre-common  = { workspace = true }
antre-metrics = { optional = true, workspace = true }
antre-tools   = { optional = true, workspace = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
hex           = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sha2          = { workspace = true }
thiserror     = { workspace = true }
time          = { workspace = true }
tokio         = { workspace = true }
toml          = { workspace = true }
tracing       = { workspace = true }
walkdir       = { workspace = true }
wasmtime      = { optional = true, workspace = true }
wasmtime-wasi = { optional = true, workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { features = ["macros", "rt-multi-thread"], workspace = true }
wat      = { workspace = true }

[lints]
workspace = true
