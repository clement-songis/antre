name: antre
version: '0.2.0'
summary: Personal AI gateway inspired by OpenClaw
description: |
  Antre is a personal AI gateway inspired by OpenClaw. One binary, multiple LLM providers.

base: core24
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  antre:
    command: bin/antre
    environment:
      ANTRE_SHARE_DIR: $SNAP/share/antre
    plugs:
      - network
      - network-bind

parts:
  antre:
    plugin: rust
    source: .
    rust-path: ["crates/cli"]
    build-packages:
      - pkg-config
      - libssl-dev
      - cmake
      - build-essential
      - libclang-dev
      - git
      - curl
    build-snaps:
      - node/22/stable
    override-build: |
      ARCH=$(uname -m)
      case "$ARCH" in x86_64) TW="tailwindcss-linux-x64";; aarch64) TW="tailwindcss-linux-arm64";; esac
      curl -sLO "https://github.com/tailwindlabs/tailwindcss/releases/latest/download/$TW"
      chmod +x "$TW"
      TAILWINDCSS="./$TW" ./scripts/build-web-assets.sh
      rustup target add wasm32-wasip2
      cargo build --target wasm32-wasip2 -p antre-wasm-calc -p antre-wasm-web-fetch -p antre-wasm-web-search --release
      ANTRE_BUILD_FEATURES=portable ./scripts/cargo-build-antre.sh --release
      mkdir -p "$CRAFT_PART_INSTALL/bin" "$CRAFT_PART_INSTALL/share/antre/web" "$CRAFT_PART_INSTALL/share/antre/wasm"
      install -m 0755 target/release/antre "$CRAFT_PART_INSTALL/bin/antre"
      cp -R "crates/web/src/assets/." "$CRAFT_PART_INSTALL/share/antre/web/"
      cp "target/wasm32-wasip2/release/antre_wasm_calc.wasm" "$CRAFT_PART_INSTALL/share/antre/wasm/"
      cp "target/wasm32-wasip2/release/antre_wasm_web_fetch.wasm" "$CRAFT_PART_INSTALL/share/antre/wasm/"
      cp "target/wasm32-wasip2/release/antre_wasm_web_search.wasm" "$CRAFT_PART_INSTALL/share/antre/wasm/"
