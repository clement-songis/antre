# Builds the public site (landing page + docs under /docs/) and publishes it to the
# GitHub Pages org root, antre-ai/antre-ai.github.io. Deployment shape: website/README.md.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "install.sh"
      - "crates/web/ui/src/theme/tokens.css"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "install.sh"
      - "crates/web/ui/src/theme/tokens.css"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Workflow Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@135698455da5c3b3e55f73f4419e481ab68cdd95 # v0.4.1
        with:
          advanced-security: false
          online-audits: false

  build:
    name: Build site
    needs: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Bare host name of a custom domain; empty keeps https://antre-ai.github.io and writes no CNAME.
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: docs-validation-v1
          cache-all-crates: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            website/package-lock.json

      - name: Install validation tools
        run: |
          cargo install mdbook-lint --version 0.14.3 --locked
          cargo install lychee --version 0.24.2 --locked

      - name: Install dependencies
        run: |
          npm ci --prefix docs
          npm ci --prefix website

      - name: Lint documentation markdown
        working-directory: docs
        run: mdbook-lint lint --enable MD001,MD003,MD009,MD010,MD011,MD014 src

      - name: Build documentation
        run: npm run build --prefix docs

      - name: Test site build
        run: npm test --prefix website

      - name: Build site
        run: node website/scripts/build-site.mjs --require-docs

      - name: Check site links
        run: lychee --offline --root-dir "$PWD/website/dist" --no-progress website/dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: website/dist
          # .nojekyll and .well-known/ are part of the site.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to antre-ai.github.io
    needs: build
    if: github.repository == 'antre-ai/antre' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    # Holds SITE_DEPLOY_KEY; restrict it to the main branch in the environment settings.
    environment:
      name: site-publish
      url: https://antre-ai.github.io/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: site

      - name: Push to the Pages repository
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: antre-ai/antre-ai.github.io
          publish_branch: main
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          full_commit_message: "Deploy antre-ai/antre@${{ github.sha }}"
