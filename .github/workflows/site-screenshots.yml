# Captures the app screenshots shown on https://antre-ai.github.io and publishes them on the
# orphan branch site-screenshots, which the site repo reads anonymously (see docs/README.md).
name: Site screenshots

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-screenshots
  cancel-in-progress: false

jobs:
  capture:
    name: Capture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: main

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # master
        with:
          toolchain: stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/web/ui/package-lock.json

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: e2e-v1
          save-if: false

      - name: Install npm dependencies
        working-directory: crates/web/ui
        run: npm ci

      - name: Build web assets
        run: |
          ./scripts/download-tailwindcss-cli.sh tailwindcss-linux-x64
          TAILWINDCSS=./tailwindcss-linux-x64 ./scripts/build-web-assets.sh

      - name: Build antre binary
        timeout-minutes: 30
        run: cargo build --bin antre

      - name: Reclaim Rust build disk
        run: bash ./scripts/cleanup-e2e-build-artifacts.sh

      - name: Install Playwright browsers
        timeout-minutes: 3
        working-directory: crates/web/ui
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        working-directory: crates/web/ui
        env:
          ANTRE_BINARY: ${{ github.workspace }}/target/e2e-bin/antre
          ANTRE_SITE_SCREENSHOTS_DIR: ${{ runner.temp }}/site-screenshots
        run: npx playwright test -c playwright.site-screenshots.config.cjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-screenshots
          path: ${{ runner.temp }}/site-screenshots
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to the site-screenshots branch
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-screenshots
          path: screenshots

      - name: Push a single orphan commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd screenshots
          cat > README.md <<'README'
          App screenshots for https://antre-ai.github.io, generated by
          .github/workflows/site-screenshots.yml. This branch is rewritten on every run.
          README
          git init -q -b site-screenshots
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Site screenshots from ${SOURCE_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" site-screenshots
